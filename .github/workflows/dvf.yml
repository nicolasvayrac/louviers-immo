name: Mettre à jour les prix (DVF)

on:
  schedule:
    - cron: "41 4 6 * *"   # le 6 de chaque mois, vers 6 h (heure de Paris)
  workflow_dispatch:        # bouton « Run workflow » dans l'onglet Actions

permissions:
  contents: write

jobs:
  dvf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Télécharger les ventes DVF et recalculer les prix
        run: python3 scripts/update_dvf.py
      - name: Régénérer les pages (prix par quartier, pages quartiers)
        run: |
          pip install --quiet pillow
          python3 scripts/gen.py
      - name: Enregistrer s'il y a du nouveau
        run: |
          git config user.name "louviers.immo (robot)"
          git config user.email "actions@users.noreply.github.com"
          git add data sitemap.xml '*.html'
          git diff --cached --quiet || (git commit -m "Prix DVF mis à jour le $(date +%d/%m/%Y)" && git pull --rebase --autostash && git push)
