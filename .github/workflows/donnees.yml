name: Mettre à jour les données

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pois:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Télécharger les commerces et équipements (OpenStreetMap)
        run: python3 scripts/build_pois.py
      - name: Enregistrer s'il y a du nouveau
        run: |
          git config user.name "louviers.immo (robot)"
          git config user.email "actions@users.noreply.github.com"
          git add data/pois.json
          git diff --cached --quiet || (git commit -m "Données OpenStreetMap du $(date +%d/%m/%Y)" && git push)
