# Configuration Netlify pour louviers.immo
[build]
  publish = "."

# Anciennes pages de l'opération « taxe foncière offerte » (terminée le 31 juillet 2026)
[[redirects]]
  from = "/reglement.html"
  to = "/"
  status = 301
  force = true
[[redirects]]
  from = "/contact.html"
  to = "/a-propos.html"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=()"

# Données DVF : non indexées par les moteurs de recherche (conditions de réutilisation)
[[headers]]
  for = "/data/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
