# Configuration Netlify pour louviers.immo
[build]
  publish = "."

# Anciennes pages de l'opération « taxe foncière offerte » (terminée le 31 juillet 2026)
[[redirects]]
  from = "/reglement.html"
  to = "/"
  status = 301
  force = true
[[redirects]]
  from = "/contact.html"
  to = "/a-propos.html"
  status = 301
  force = true

# Anciennes pages quartiers (7 secteurs) → découpage officiel de la Ville (18 quartiers)
[[redirects]]
  from = "/quartiers/centre-ville.html"
  to = "/quartiers/coeur-de-ville.html"
  status = 301
  force = true

# Adresses courtes des supports imprimés (QR codes). Réécriture (200) : l'adresse reste
# louviers.immo/set, ce qui permet de compter chaque support dans la mesure d'audience.
# La provenance est ensuite ajoutée aux formulaires (voir LI.SUPPORTS dans assets/site.js).
[[redirects]]
  from = "/set"
  to = "/prix.html"
  status = 200
  force = true
[[redirects]]
  from = "/sac"
  to = "/index.html"
  status = 200
  force = true
[[redirects]]
  from = "/vitrine"
  to = "/commerces.html"
  status = 200
  force = true
[[redirects]]
  from = "/agence"
  to = "/index.html"
  status = 200
  force = true
[[redirects]]
  from = "/affiche"
  to = "/index.html"
  status = 200
  force = true
[[redirects]]
  from = "/presse"
  to = "/index.html"
  status = 200
  force = true
[[redirects]]
  from = "/carte"
  to = "/index.html"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=()"
    # AVANT LE LANCEMENT : interdit à Google d'indexer le site de test.
    # À SUPPRIMER le jour de la mise en ligne officielle sur louviers.immo.
    X-Robots-Tag = "noindex, nofollow"

# Données DVF : non indexées par les moteurs de recherche (conditions de réutilisation)
[[headers]]
  for = "/data/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
